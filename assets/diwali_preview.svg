<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <!-- Happy Diwali artwork for the home/OTT top preview. Art sits on the right;
       the left side is covered by the preview text and fade. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A0626"/>
      <stop offset="0.45" stop-color="#3E0E3A"/>
      <stop offset="0.75" stop-color="#651530"/>
      <stop offset="1" stop-color="#2A0A26"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.68" cy="0.82" r="0.45">
      <stop offset="0" stop-color="#FF9A2E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF9A2E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.88" cy="0.15" r="0.35">
      <stop offset="0" stop-color="#FF3CA0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FF3CA0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD54A" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#FF8A1E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF8A1E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7C2"/>
      <stop offset="0.45" stop-color="#FFC233"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <g id="petal"><ellipse cx="0" cy="-92" rx="30" ry="62"/></g>
    <g id="diya">
      <circle cx="0" cy="-30" r="70" fill="url(#glow)"/>
      <path d="M0 -78 C 14 -58, 16 -40, 0 -24 C -16 -40, -14 -58, 0 -78 Z" fill="url(#flame)"/>
      <path d="M-62 -18 Q 0 -10 62 -18 Q 56 30 0 34 Q -56 30 -62 -18 Z" fill="url(#clay)"/>
      <path d="M-62 -18 Q 0 -6 62 -18" fill="none" stroke="#FFD08A" stroke-width="4"/>
      <circle cx="-26" cy="10" r="4" fill="#FFE3A3"/><circle cx="0" cy="14" r="4" fill="#FFE3A3"/><circle cx="26" cy="10" r="4" fill="#FFE3A3"/>
    </g>
    <g id="burst" stroke-linecap="round" stroke-width="5">
      <path d="M0 -60V-20M0 60V20M-60 0H-20M60 0H20M-42 -42L-14 -14M42 42L14 14M42 -42L14 -14M-42 42L-14 14"/>
    </g>
  </defs>

  <rect width="1600" height="400" fill="url(#sky)"/>
  <rect width="1600" height="400" fill="url(#warm)"/>
  <rect width="1600" height="400" fill="url(#pink)"/>

  <!-- art shifted left: the preview crops the right edge -->
  <g transform="translate(-200 0)">

  <!-- bokeh -->
  <g opacity="0.5">
    <circle cx="760" cy="180" r="22" fill="#FFD54A" opacity="0.35"/>
    <circle cx="980" cy="300" r="30" fill="#FF4FA3" opacity="0.3"/>
    <circle cx="1450" cy="250" r="26" fill="#B78CFF" opacity="0.35"/>
    <circle cx="860" cy="220" r="14" fill="#5EEBFF" opacity="0.35"/>
    <circle cx="1560" cy="330" r="18" fill="#FFD54A" opacity="0.35"/>
  </g>

  <!-- rangoli -->
  <g transform="translate(1400 170) scale(0.55)" opacity="0.6">
    <circle r="250" fill="none" stroke="#FFD54A" stroke-width="3" stroke-dasharray="2 18" stroke-linecap="round"/>
    <g fill="#E8508F" opacity="0.75">
      <use href="#petal"/><use href="#petal" transform="rotate(30)"/><use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(150)"/>
      <use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(210)"/><use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(300)"/><use href="#petal" transform="rotate(330)"/>
    </g>
    <g fill="#7C6CF0" opacity="0.7" transform="scale(0.6) rotate(15)">
      <use href="#petal"/><use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(315)"/>
    </g>
    <circle r="36" fill="#FF9A2E"/><circle r="20" fill="#E8508F"/>
  </g>

  <!-- fireworks -->
  <g stroke="#FFD54A" transform="translate(1110 95) scale(0.85)"><use href="#burst"/></g>
  <g stroke="#FF6FB5" transform="translate(1510 115) scale(0.8)"><use href="#burst"/></g>
  <g stroke="#7FE7FF" transform="translate(860 80) scale(0.5)"><use href="#burst"/></g>
  <g fill="#FFD54A">
    <circle cx="1110" cy="95" r="5"/><circle cx="1510" cy="115" r="5"/><circle cx="860" cy="80" r="4"/>
  </g>

  <!-- string lights -->
  <path d="M560 20 Q 760 80 960 30 T 1360 30 T 1600 40" fill="none" stroke="#C9A6A0" stroke-width="2" opacity="0.6"/>
  <g>
    <circle cx="600" cy="38" r="9" fill="#FFD54A"/><circle cx="680" cy="56" r="9" fill="#FF4FA3"/>
    <circle cx="760" cy="62" r="9" fill="#5EEBFF"/><circle cx="840" cy="56" r="9" fill="#FF8A3D"/>
    <circle cx="920" cy="40" r="9" fill="#B78CFF"/><circle cx="1000" cy="36" r="9" fill="#FFD54A"/>
    <circle cx="1080" cy="50" r="9" fill="#FF4FA3"/><circle cx="1160" cy="58" r="9" fill="#5EEBFF"/>
    <circle cx="1240" cy="48" r="9" fill="#FF8A3D"/><circle cx="1320" cy="34" r="9" fill="#B78CFF"/>
    <circle cx="1400" cy="38" r="9" fill="#FFD54A"/><circle cx="1480" cy="52" r="9" fill="#FF4FA3"/>
    <circle cx="1560" cy="44" r="9" fill="#5EEBFF"/>
  </g>

  <!-- diyas -->
  <g transform="translate(820 255) scale(0.5)"><use href="#diya"/></g>
  <g transform="translate(910 250) scale(0.58)"><use href="#diya"/></g>
  <g transform="translate(1015 245) scale(0.68)"><use href="#diya"/></g>
  <g transform="translate(1120 250) scale(0.58)"><use href="#diya"/></g>
  <g transform="translate(1210 255) scale(0.5)"><use href="#diya"/></g>
  </g>
</svg>
